name: Tests with PostGIS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: terra-firma-ci
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build and run the full suite with PostgreSQL/PostGIS
        run: docker compose -f compose.test.yaml up --build --abort-on-container-exit --exit-code-from tests

      - name: Show container diagnostics on failure
        if: failure()
        run: |
          docker compose -f compose.test.yaml ps -a
          docker compose -f compose.test.yaml logs --no-color

      - name: Remove test containers and volumes
        if: always()
        run: docker compose -f compose.test.yaml down --volumes --remove-orphans
