services:
  db:
    image: postgis/postgis:16-3.7
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-terra_firma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-terra_firma}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
  migrate:
    build: ./backend
    command: ["python", "-m", "backend.migrate"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-terra_firma}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-terra_firma}
    depends_on:
      db:
        condition: service_healthy
  dados:
    build: ./dados-api
    environment:
      DATA_API_KEY: ${DATA_API_KEY:?Defina DATA_API_KEY no .env}
      DATA_MODE: ${DATA_MODE:-demo}
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:-}
    ports:
      - "127.0.0.1:${DATA_PORT:-8001}:8001"
  backend:
    build: ./backend
    environment:
      DATA_API_KEY: ${DATA_API_KEY:?Defina DATA_API_KEY no .env}
      DATA_API_URL: http://dados:8001
      DATABASE_URL: postgresql://${POSTGRES_USER:-terra_firma}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-terra_firma}
      PHOTO_DIR: /app/data/photos
      VISION_MODE: ${VISION_MODE:-simulated}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      EVIDENCE_RADIUS_KM: ${EVIDENCE_RADIUS_KM:-10}
      EVIDENCE_WINDOW_HOURS: ${EVIDENCE_WINDOW_HOURS:-24}
    volumes:
      - private_photos:/app/data/photos
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      dados:
        condition: service_started
  web:
    build: ./web
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_started
volumes:
  postgres_data:
  private_photos:
